<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xplore Wi-Fi Sticker Generator</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="lib/qrcode.min.js"></script>
<script src="lib/html2canvas.min.js"></script>
<link rel="stylesheet" href="lib/poppins.css">
<style>

  :root{
    --bg:#ffffff;
    --panel:#ffffff;
    --panel-2:#ffffff;
    --border:#000000;
    --border-soft:#000000;
    --cyan:#000000;
    --cyan-dim:#e6e6e6;
    --amber:#000000;
    --text:#000000;
    --text-secondary:#000000;
    --text-muted:#5a5a5a;
  }

  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: #f4f4f4;
    color: var(--text);
    font-family: 'Poppins', sans-serif;
    min-height:100vh;
    overflow-x:hidden; /* safety net: nothing may scroll the page sideways */
  }
  .topbar{
    padding: 22px 32px;
    border-bottom: 1px solid var(--border-soft);
    display:flex;
    align-items:baseline;
    gap:12px;
    flex-wrap:wrap;
    background:#fff;
  }
  .topbar .mark{
    font-family:'Poppins', sans-serif;
    font-weight:700;
    font-size:20px;
    letter-spacing:0.5px;
  }
  .topbar .mark span{ color: var(--cyan); }
  .topbar .sub{
    font-size:13px;
    color: var(--text-secondary);
  }
  .topbar .notice{
    margin-left:auto;
    font-size:11.5px;
    color: var(--text-muted);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .topbar .notice .dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--cyan);
    flex-shrink:0;
  }
  .layout{
    display:grid;
    grid-template-columns: minmax(340px, 460px) 1fr;
    gap:32px;
    padding: 32px;
    max-width: 1220px;
    margin: 0 auto;
    align-items:start;
  }
  .layout > *{ min-width:0; } /* let columns shrink below the card's fixed width on phones */
  @media (max-width: 940px){
    .layout{ grid-template-columns: 1fr; padding: 20px; gap:24px; }
  }
  @media (max-width: 600px){
    .topbar{ padding:16px 18px; gap:8px; }
    .topbar .mark{ font-size:17px; }
    .topbar .sub{ font-size:12px; }
    .topbar .notice{ font-size:11px; margin-left:0; width:100%; }
    .layout{ padding:14px; gap:18px; }
    .panel{ padding:18px; border-radius:12px; }
    .field input, .field select{
      font-size:16px; /* keep at 16px so iOS Safari doesn't zoom in on focus */
      padding:12px 12px;
    }
    .row-2{ grid-template-columns: 1fr; gap:16px; }
    .actions{ margin-top:20px; }
    button.btn{ padding:13px 14px; font-size:14px; }
  }

  /* ---- form ---- */
  .lang-toggle{
    position:absolute;
    top:12px;
    right:12px; /* tucked inside the panel's top-right corner */
    display:flex;
    border:1px solid #000;
    border-radius:8px;
    overflow:hidden;
    background:#fff;
  }
  .lang-toggle button{
    background:#fff;
    border:none;
    color:#000;
    font-family:'Poppins',sans-serif;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.04em;
    padding:6px 12px;
    cursor:pointer;
  }
  .lang-toggle button + button{ border-left:1px solid #000; }
  .lang-toggle button.active{
    background:#000;
    color:#fff;
    cursor:default;
  }
  .panel h2{ padding-right:100px; } /* keep the title clear of the toggle */
  @media (max-width: 600px){
    .lang-toggle{ right:10px; top:10px; }
  }
  .panel{
    position:relative;
    background: var(--panel);
    border: 1px solid #ddd;
    border-radius: 14px;
    padding: 24px;
  }
  .panel h2{
    font-family:'Poppins', sans-serif;
    font-size:15px;
    font-weight:600;
    margin: 0 0 4px;
    color: var(--text);
  }
  .panel .hint{
    font-size:12.5px;
    color: var(--text-muted);
    margin: 0 0 20px;
  }
  .field{ margin-bottom:16px; }
  .field label{
    display:block;
    font-size:12px;
    font-weight:600;
    text-transform: uppercase;
    letter-spacing:0.06em;
    color: var(--text-secondary);
    margin-bottom:6px;
  }
  .field input, .field select{
    width:100%;
    background: var(--panel-2);
    border: 1px solid #ccc;
    color: var(--text);
    font-family:'Poppins', sans-serif;
    font-size:14px;
    padding: 10px 12px;
    border-radius:8px;
    outline:none;
  }
  .field input::placeholder{ color: var(--text-muted); font-family:'Poppins',sans-serif; }
  .field input:focus, .field select:focus{
    border-color: var(--cyan);
    box-shadow: 0 0 0 3px var(--cyan-dim);
  }
  .row-2{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
  .pw-wrap{ position:relative; }
  .pw-wrap input{ padding-right:60px; }
  .pw-toggle{
    position:absolute;
    right:8px;
    top:50%;
    transform: translateY(-50%);
    background:none;
    border:none;
    color: var(--cyan);
    font-family:'Poppins',sans-serif;
    font-size:11px;
    font-weight:600;
    cursor:pointer;
    letter-spacing:0.04em;
  }
  .divider{
    border:none;
    border-top:1px solid #ddd;
    margin: 22px 0;
  }
  .actions{ display:flex; gap:10px; margin-top:22px; }
  button.btn{
    flex:1;
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:13.5px;
    padding: 11px 14px;
    border-radius:8px;
    border:1px solid #ccc;
    background: var(--panel-2);
    color: var(--text);
    cursor:pointer;
  }
  button.btn:hover{ border-color: #999; }
  button.btn.primary{
    background: var(--cyan);
    border-color: var(--cyan);
    color: #fff;
  }
  button.btn.primary:hover{ opacity:0.92; }
  button.btn:disabled{ opacity:0.6; cursor:default; }

  /* ---- preview / card ---- */
  .preview-label{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color: var(--text-muted);
    margin: 0 0 12px 4px;
    font-weight:600;
  }
  .card-stage{
    display:flex;
    justify-content:center;
    padding: 8px 4px 24px;
    overflow:hidden; /* pre-JS, the 500px card is clipped instead of widening the page */
  }
  .card-scale-wrap{
    width:500px;
    max-width:100%;
    height:800px;
    flex-shrink:0;
  }
  .card{
    width:500px;
    height:800px;
    flex-shrink:0;
    background:#FFFFFF;
    border-radius:0;
    padding:30px 34px 34px;
    position:relative;
    display:flex;
    flex-direction:column;
    transform-origin: top left;
  }

  .card{ --ink:#000000; color:var(--ink); font-family:'Poppins', sans-serif; }

  .card-head{
    display:flex;
    flex-direction:row;
    align-items:center;
    justify-content:center;
    gap:18px;
    margin-bottom: 22px;
  }
  .card-head .logo{
    height:48px;
    width:auto;
    display:block;
  }
  .card-head .tag{
    font-size:19px;
    line-height:1.05;
    font-weight:700;
    color:var(--ink);
    letter-spacing:0.01em;
    text-transform:uppercase;
    text-align:left;
    max-width:200px; /* forces the two-line "WI-FI INFORMATION / CARD" break */
  }

  .card-body{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:0;
    overflow:hidden; /* lets fitValues() detect when content would spill off the card */
  }
  .qr-col{
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:18px;
  }
  .qr-caption{
    font-size:18px;
    font-weight:500;
    color:var(--ink);
    order:-1;          /* caption sits above the QR code */
    white-space:nowrap; /* one line always — fitCaption() shrinks it rather than wrapping */
    max-width:100%;
  }
  .qr-block{
    background:#fff;
    border-radius:0;
    padding:0;
    line-height:0;
  }
  .qr-block canvas{ width:310px; height:310px; display:block; }
  .qr-empty{
    width:310px; height:310px;
    display:flex; align-items:center; justify-content:center;
    color:#666666; font-size:12px; line-height:1.45; text-align:center;
    padding:8px; border:1px dashed #D9D9D9;
  }

  .info-col{
    width:100%;
    display:flex;
    flex-direction:column;
    min-width:0;
  }

  .wifi-grid{
    display:flex;
    flex-direction:column;
    gap:12px;
    width:100%;
  }
  .wifi-cell .k{
    font-size:22px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:0;
  }
  .wifi-cell .v{
    font-size:40px;
    font-weight:700;
    color:var(--ink);
    word-break:break-word;
    line-height:1.05;
  }

  .support-block{
    border-top:2px solid var(--ink);
    padding-top:12px;
    margin-top:16px;
  }

  .support-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:12px;
    margin-bottom:6px;
  }
  .support-row:last-child{ margin-bottom:0; }

  .support-row .k{
    font-size:19px;
    font-weight:600;
    text-transform:uppercase;
    color:var(--ink);
    flex-shrink:0;
  }

  .support-row .v{
    font-size:28px;
    font-weight:700;
    color:var(--ink);
    text-align:right;
    white-space:nowrap; /* phone + URL are fixed-width constants; never wrap them */
  }
  .support-row.account .v{
    font-size:30px;
    white-space:normal;      /* account numbers vary in length, so */
    word-break:break-word;   /* let this one wrap if it must */
  }
</style>
</head>
<body>



<div class="layout">

  <div class="panel">
    <div class="lang-toggle" role="group" aria-label="Language / Langue">
      <button type="button" id="langEn">EN</button>
      <button type="button" id="langFr">FR</button>
    </div>
    <h2 data-i18n="title">Xplore Wi-Fi Sticker Generator</h2>

      </div>

    langFrBtn.classList.toggle('active', lang === 'fr');
    render();
  }

  langEnBtn.addEventListener('click', () => applyLang('en'));
  langFrBtn.addEventListener('click', () => applyLang('fr'));

  const outAcct = document.getElementById('outAcct');
  const outSsid = document.getElementById('outSsid');
  const outPw = document.getElementById('outPw');
  const outLink = document.getElementById('outLink');
  const qrDiv = document.getElementById('qrcode');
  const cardEl = document.getElementById('card');
  const cardScaleWrap = document.getElementById('cardScaleWrap');
  const downloadBtn = document.getElementById('downloadBtn');

  function fitCardToScreen(){
    const available = cardScaleWrap.parentElement.clientWidth - 8;
    const scale = Math.min(1, available / 500);
    cardEl.style.transform = `scale(${scale})`;
    cardScaleWrap.style.width = (500 * scale) + 'px';
    cardScaleWrap.style.height = (800 * scale) + 'px';
  }
  window.addEventListener('resize', fitCardToScreen);
  window.addEventListener('load', fitCardToScreen); /* re-measure once fonts/layout settle */
  window.addEventListener('orientationchange', () => setTimeout(fitCardToScreen, 100));
  fitCardToScreen();

  function escapeWifi(str){
    return str.replace(/([\\;,:"])/g, '\\$1');
  }

  function buildWifiString(){
    const s = ssid.value.trim();
    const p = pw.value;
    if(!s) return null;
    if(!p){
      // No password entered = open network
      return `WIFI:T:nopass;S:${escapeWifi(s)};;`;
    }
    return `WIFI:T:WPA;S:${escapeWifi(s)};P:${escapeWifi(p)};;`;
  }

  function render(){
    outAcct.textContent = acct.value.trim() || '—';
    outSsid.textContent = ssid.value.trim() || '—';
    outPw.textContent = pw.value ? pw.value : (ssid.value.trim() ? t('openNetwork') : '—');
    outLink.textContent = SUPPORT_LINK;

    fitCaption();
    fitValues();

    const wifiStr = buildWifiString();
    qrDiv.innerHTML = '';
    if(wifiStr){
      qrDiv.appendChild(drawBrandedQr(wifiStr));
    } else {
      const empty = document.createElement('div');
      empty.className = 'qr-empty';
      empty.textContent = t('qrEmpty');
      qrDiv.appendChild(empty);
    }
  }

  // Long SSIDs / passwords wrap onto extra lines and can push the bottom rows
  // off the 800px card. Step the value size down until everything fits.
  const cardBody = cardEl.querySelector('.card-body');
  // The French caption is longer than the English one. Rather than let it wrap
  // onto a second line, step the size down until it fits the card width.
  const qrCaption = cardEl.querySelector('.qr-caption');
  function fitCaption(){
    let size = 18;
    qrCaption.style.fontSize = size + 'px';
    const avail = cardBody.clientWidth;
    while(qrCaption.scrollWidth > avail && size > 12){
      size -= 0.5;
      qrCaption.style.fontSize = size + 'px';
    }
  }

  function fitValues(){
    const vals = [outSsid, outPw];
    let size = 40;
    vals.forEach(v => v.style.fontSize = size + 'px');
    const overflows = () => cardBody.scrollHeight > cardBody.clientHeight + 1;
    while(overflows() && size > 22){
      size -= 2;
      vals.forEach(v => v.style.fontSize = size + 'px');
    }
  }

  function qrMatrix(text){
    // qrcode.min.js only draws to the DOM, so build it off-screen and read its module grid.
    const scratch = document.createElement('div');
    const qr = new QRCode(scratch, { text, width: 32, height: 32, correctLevel: QRCode.CorrectLevel.H });
    const model = qr._oQRCode;
    const n = model.getModuleCount();
    const m = [];
    for(let r = 0; r < n; r++){
      const row = [];
      for(let c = 0; c < n; c++) row.push(model.isDark(r, c));
      m.push(row);
    }
    return m;
  }

  function drawBrandedQr(text){
    const m = qrMatrix(text);
    const n = m.length;
    const px = QR_CSS_SIZE * QR_RENDER_SCALE;
    const canvas = document.createElement('canvas');
    canvas.width = px; canvas.height = px;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, px, px);

    const ms = px / n;                    // module size
    const inFinder = (r, c) =>
      (r < 7 && c < 7) || (r < 7 && c >= n - 7) || (r >= n - 7 && c < 7);

    // Centre clearance for the X mark. ~21% of the width; level-H correction absorbs the loss.
    const logoW = px * 0.21;
    const clear = logoW * 1.18;
    const c0 = (px - clear) / 2, c1 = (px + clear) / 2;
    const inLogo = (r, c) => {
      const x = (c + 0.5) * ms, y = (r + 0.5) * ms;
      return x > c0 && x < c1 && y > c0 && y < c1;
    };

    ctx.fillStyle = QR_INK;
    const dotR = ms * 0.43;
    for(let r = 0; r < n; r++){
      for(let c = 0; c < n; c++){
        if(!m[r][c] || inFinder(r, c) || inLogo(r, c)) continue;
        ctx.beginPath();
        ctx.arc((c + 0.5) * ms, (r + 0.5) * ms, dotR, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Finder patterns as ring + dot
    const finders = [[0, 0], [0, n - 7], [n - 7, 0]];
    ctx.strokeStyle = QR_INK;
    ctx.lineWidth = ms;
    finders.forEach(([r, c]) => {
      const cx = (c + 3.5) * ms, cy = (r + 3.5) * ms;
      ctx.beginPath(); ctx.arc(cx, cy, ms * 3, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy, ms * 1.5, 0, Math.PI * 2); ctx.fill();
    });

    // Xplore X in the centre
    if(X_MARK.complete && X_MARK.naturalWidth){
      const h = logoW * (X_MARK.naturalHeight / X_MARK.naturalWidth);
      ctx.drawImage(X_MARK, (px - logoW) / 2, (px - h) / 2, logoW, h);
    }
    return canvas;
  }

  [acct, ssid, pw].forEach(el => {
    el.addEventListener('input', render);
    el.addEventListener('change', render);
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    [acct, ssid, pw].forEach(el => el.value = '');
    render();
  });

  downloadBtn.addEventListener('click', () => {
    downloadBtn.disabled = true;
    downloadBtn.textContent = t('rendering');
    cardEl.style.transform = 'none'; // capture at true, untouched size every time
    html2canvas(cardEl, {
      width: 500,
      height: 800,
      scale: QR_RENDER_SCALE,
      backgroundColor: '#ffffff',
      useCORS: true
    }).then(canvas => {
      const link = document.createElement('a');
      const acctPart = acct.value.trim().replace(/[^a-z0-9-]/gi, '') || 'customer';
      link.download = `xplore-setup-card-${acctPart}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      downloadBtn.disabled = false;
      downloadBtn.textContent = t('download');
      fitCardToScreen();
    }).catch(() => {
      downloadBtn.disabled = false;
      downloadBtn.textContent = t('download');
      fitCardToScreen();
      alert(t('renderError'));
    });
  });

  applyLang(lang); // apply saved (or default) language, then first render happens inside

  // ---- offline support ----
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {
        /* offline caching unavailable; app still works online */
      });
    });
  }
