<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xplore Wi-Fi Sticker Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

  :root{
    --bg:#ffffff;
    --panel:#ffffff;
    --panel-2:#ffffff;
    --border:#000000;
    --border-soft:#000000;
    --cyan:#000000;
    --cyan-dim:#e6e6e6;
    --amber:#000000;
    --text:#000000;
    --text-secondary:#000000;
    --text-muted:#5a5a5a;
  }

  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: #f4f4f4;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height:100vh;
  }
  .topbar{
    padding: 22px 32px;
    border-bottom: 1px solid var(--border-soft);
    display:flex;
    align-items:baseline;
    gap:12px;
    flex-wrap:wrap;
    background:#fff;
  }
  .topbar .mark{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:20px;
    letter-spacing:0.5px;
  }
  .topbar .mark span{ color: var(--cyan); }
  .topbar .sub{
    font-size:13px;
    color: var(--text-secondary);
  }
  .topbar .notice{
    margin-left:auto;
    font-size:11.5px;
    color: var(--text-muted);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .topbar .notice .dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--cyan);
    flex-shrink:0;
  }
  .layout{
    display:grid;
    grid-template-columns: minmax(340px, 460px) 1fr;
    gap:32px;
    padding: 32px;
    max-width: 1220px;
    margin: 0 auto;
    align-items:start;
  }
  @media (max-width: 940px){
    .layout{ grid-template-columns: 1fr; padding: 20px; gap:24px; }
  }
  @media (max-width: 600px){
    .topbar{ padding:16px 18px; gap:8px; }
    .topbar .mark{ font-size:17px; }
    .topbar .sub{ font-size:12px; }
    .topbar .notice{ font-size:11px; margin-left:0; width:100%; }
    .layout{ padding:14px; gap:18px; }
    .panel{ padding:18px; border-radius:12px; }
    .field input, .field select{
      font-size:16px; /* keep at 16px so iOS Safari doesn't zoom in on focus */
      padding:12px 12px;
    }
    .row-2{ grid-template-columns: 1fr; gap:16px; }
    .actions{ margin-top:20px; }
    button.btn{ padding:13px 14px; font-size:14px; }
  }

  /* ---- form ---- */
  .panel{
    background: var(--panel);
    border: 1px solid #ddd;
    border-radius: 14px;
    padding: 24px;
  }
  .panel h2{
    font-family:'Space Grotesk', sans-serif;
    font-size:15px;
    font-weight:600;
    margin: 0 0 4px;
    color: var(--text);
  }
  .panel .hint{
    font-size:12.5px;
    color: var(--text-muted);
    margin: 0 0 20px;
  }
  .field{ margin-bottom:16px; }
  .field label{
    display:block;
    font-size:12px;
    font-weight:600;
    text-transform: uppercase;
    letter-spacing:0.06em;
    color: var(--text-secondary);
    margin-bottom:6px;
  }
  .field input, .field select{
    width:100%;
    background: var(--panel-2);
    border: 1px solid #ccc;
    color: var(--text);
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    padding: 10px 12px;
    border-radius:8px;
    outline:none;
  }
  .field input::placeholder{ color: var(--text-muted); font-family:'Inter',sans-serif; }
  .field input:focus, .field select:focus{
    border-color: var(--cyan);
    box-shadow: 0 0 0 3px var(--cyan-dim);
  }
  .row-2{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
  .pw-wrap{ position:relative; }
  .pw-wrap input{ padding-right:60px; }
  .pw-toggle{
    position:absolute;
    right:8px;
    top:50%;
    transform: translateY(-50%);
    background:none;
    border:none;
    color: var(--cyan);
    font-family:'Inter',sans-serif;
    font-size:11px;
    font-weight:600;
    cursor:pointer;
    letter-spacing:0.04em;
  }
  .divider{
    border:none;
    border-top:1px solid #ddd;
    margin: 22px 0;
  }
  .actions{ display:flex; gap:10px; margin-top:22px; }
  button.btn{
    flex:1;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:13.5px;
    padding: 11px 14px;
    border-radius:8px;
    border:1px solid #ccc;
    background: var(--panel-2);
    color: var(--text);
    cursor:pointer;
  }
  button.btn:hover{ border-color: #999; }
  button.btn.primary{
    background: var(--cyan);
    border-color: var(--cyan);
    color: #fff;
  }
  button.btn.primary:hover{ opacity:0.92; }
  button.btn:disabled{ opacity:0.6; cursor:default; }

  /* ---- preview / card ---- */
  .preview-label{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color: var(--text-muted);
    margin: 0 0 12px 4px;
    font-weight:600;
  }
  .card-stage{
    display:flex;
    justify-content:center;
    padding: 8px 4px 24px;
  }
  .card-scale-wrap{
    width:500px;
    height:800px;
    flex-shrink:0;
  }
  .card{
    width:500px;
    height:800px;
    flex-shrink:0;
    background:#FFFFFF;
    border-radius:0;
    padding:30px 34px 34px;
    position:relative;
    display:flex;
    flex-direction:column;
    transform-origin: top left;
  }

  .card-head{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:11px;
    margin-bottom: 16px;
  }
  .card-head .logo{
    height:52px;
    width:auto;
    display:block;
  }
  .card-head .tag{
    font-size:14px;
    font-weight:700;
    color:#000;
    letter-spacing:0.03em;
    text-transform:uppercase;
    text-align:center;
  }

  .card-body{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:0;
  }
  .qr-col{
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:9px;
    margin-bottom:16px;
  }
  .qr-block{
    background:#fff;
    border-radius:0;
    padding:0;
    line-height:0;
  }
  .qr-caption{
    font-size:14px;
    font-weight:700;
    color:#000;
    text-transform:uppercase;
    letter-spacing:0.06em;
  }

  .info-col{
    width:100%;
    display:flex;
    flex-direction:column;
    min-width:0;
  }

  .wifi-grid{
    display:flex;
    flex-direction:column;
    gap:13px;
    width:100%;
  }
  .wifi-cell .k{
    font-size:23px;
    font-weight:700;
    color:#000;
    margin-bottom:2px;
  }
  .wifi-cell .v{
    font-size:42px;
    font-weight:700;
    color:#000;
    word-break:break-word;
    line-height:1.05;
  }

  .support-block{
    border-top:2px solid #000;
    padding-top:13px;
    margin-top:16px;
  }

  .support-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:12px;
    margin-bottom:8px;
  }
  .support-row:last-child{ margin-bottom:0; }

  .support-row .k{
    font-size:19px;
    font-weight:700;
    text-transform:uppercase;
    color:#000;
    flex-shrink:0;
  }

  .support-row .v{
    font-family:'IBM Plex Mono', monospace;
    font-size:28px;
    font-weight:700;
    color:#000;
    text-align:right;
    word-break:break-word;
  }
  .support-row.account .v{ font-size:32px; }
</style>
</head>
<body>



<div class="layout">

  <div class="panel">
    <h2>Xplore Wi-Fi Sticker Generator</h2>
    <p class="hint">Fill this in on site, then download the card as a PNG to print.</p>

    <div class="field">
      <label for="acct">Account number</label>
      <input id="acct" type="text" placeholder="e.g. 40381927" autocomplete="off" spellcheck="false">
    </div>

    <hr class="divider">

    <div class="field">
      <label for="ssid">WiFi network name (SSID)</label>
      <input id="ssid" type="text" placeholder="e.g. Xplore-Home-4B21" autocomplete="off" spellcheck="false">
    </div>

    <div class="field">
      <label for="pw">WiFi password</label>
      <div class="pw-wrap">
        <input id="pw" type="text" placeholder="e.g. sunset-otter-42" autocomplete="off" spellcheck="false">
      </div>
    </div>

    <div class="field">
      <label for="sec">Security type</label>
      <select id="sec">
        <option value="WPA">WPA / WPA2</option>
        <option value="nopass">Open (no password)</option>
        <option value="WEP">WEP</option>
      </select>
    </div>

    <hr class="divider">

    <div class="actions">
      <button class="btn" id="clearBtn">Clear form</button>
      <button class="btn primary" id="downloadBtn">Download PNG</button>
    </div>
  </div>

  <div>

          <div class="tag">Wi-Fi Information Card</div>
        </div>

        <div class="card-body">
          <div class="qr-col">
            <div class="qr-block"><div id="qrcode"></div></div>
            <div class="qr-caption">Scan to connect</div>
          </div>

          <div class="info-col">
            <div class="wifi-grid">
              <div class="wifi-cell">
                <div class="k">Wi-Fi Name</div>
                <div class="v" id="outSsid">—</div>
              </div>
              <div class="wifi-cell">
                <div class="k">Password</div>
                <div class="v" id="outPw">—</div>
              </div>
            </div>

            <div class="support-block">
              <div class="support-row account">
                <span class="k">Account Number</span>
                <span class="v" id="outAcct">—</span>
              </div>
              <div class="support-row">
                <span class="k">Support Phone</span>
                <span class="v" id="outPhone">—</span>
              </div>
              <div class="support-row">
                <span class="k">Online</span>
                <span class="v" id="outLink">—</span>
              </div>
            </div>
          </div>
        </div>

      </div>
      </div>
    </div>
  </div>

</div>

<script>
  const acct = document.getElementById('acct');
  const ssid = document.getElementById('ssid');
  const pw = document.getElementById('pw');
  const sec = document.getElementById('sec');
  const SUPPORT_PHONE = "1-866-841-6001";
  const SUPPORT_LINK = "xplore.ca/support";

  const outAcct = document.getElementById('outAcct');
  const outSsid = document.getElementById('outSsid');
  const outPw = document.getElementById('outPw');
  const outPhone = document.getElementById('outPhone');
  const outLink = document.getElementById('outLink');
  const qrDiv = document.getElementById('qrcode');
  const cardEl = document.getElementById('card');
  const cardScaleWrap = document.getElementById('cardScaleWrap');
  const downloadBtn = document.getElementById('downloadBtn');

  function fitCardToScreen(){
    const available = cardScaleWrap.parentElement.clientWidth - 8;
    const scale = Math.min(1, available / 500);
    cardEl.style.transform = `scale(${scale})`;
    cardScaleWrap.style.width = (500 * scale) + 'px';
    cardScaleWrap.style.height = (800 * scale) + 'px';
  }
  window.addEventListener('resize', fitCardToScreen);
  fitCardToScreen();

  function escapeWifi(str){
    return str.replace(/([\\;,:"])/g, '\\$1');
  }

  function buildWifiString(){
    const s = ssid.value.trim();
    const p = pw.value;
    const security = sec.value;
    if(!s) return null;
    if(security === 'nopass'){
      return `WIFI:T:nopass;S:${escapeWifi(s)};;`;
    }
    return `WIFI:T:${security};S:${escapeWifi(s)};P:${escapeWifi(p)};;`;
  }

  function render(){
    outAcct.textContent = acct.value.trim() || '—';
    outSsid.textContent = ssid.value.trim() || '—';
    outPw.textContent = pw.value ? pw.value : '—';
    outPhone.textContent = SUPPORT_PHONE;
    outLink.textContent = SUPPORT_LINK;

    const wifiStr = buildWifiString();
    qrDiv.innerHTML = '';
    if(wifiStr){
      new QRCode(qrDiv, {
        text: wifiStr,
        width: 258,
        height: 258,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    } else {
      qrDiv.innerHTML = '<div style="width:258px;height:258px;display:flex;align-items:center;justify-content:center;color:#999;font-family:Inter,sans-serif;font-size:12px;text-align:center;padding:8px;border:1px dashed #ccc;">Enter a network name to generate the QR code</div>';
    }
  }

  [acct, ssid, pw, sec].forEach(el => {
    el.addEventListener('input', render);
    el.addEventListener('change', render);
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    [acct, ssid, pw].forEach(el => el.value = '');
    sec.value = 'WPA';
    render();
  });

  downloadBtn.addEventListener('click', () => {
    downloadBtn.disabled = true;
    downloadBtn.textContent = 'Rendering…';
    cardEl.style.transform = 'none'; // capture at true, untouched size every time
    html2canvas(cardEl, {
      width: 500,
      height: 800,
      scale: 6,
      backgroundColor: '#ffffff',
      useCORS: true
    }).then(canvas => {
      const link = document.createElement('a');
      const acctPart = acct.value.trim().replace(/[^a-z0-9-]/gi, '') || 'customer';
      link.download = `xplore-setup-card-${acctPart}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      downloadBtn.disabled = false;
      downloadBtn.textContent = 'Download PNG';
      fitCardToScreen();
    }).catch(() => {
      downloadBtn.disabled = false;
      downloadBtn.textContent = 'Download PNG';
      fitCardToScreen();
      alert('Could not render the PNG. Try again.');
    });
  });

  render();
</script>
